<!DOCTYPE html>
<html lang="en">
<head>
    <title>Will you go out on a date with me?</title>
    <meta charset="UTF-8">
    <meta name="description" content="Asking you out on a date :)">
    <meta name="author" content="JuanMa the Bean Fueyo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet3.css">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div>
        <h1 id="box5">Please choose a day you'll be available! (Subject to change later)</h1>
    </div>
    
    <div class="center">
        <img id ="image" class="center" style ="border-radius: 25px" src="images\cat-calendar.jpg">
    </div>

    <div class = "calendarContainer">
        <div class="calendar">
            <div class="header">
                <button id="prevBtn">
                    <i class="fa-solid fa-chevron-left"><</i>
                </button>
                <div class="monthYear" id="monthYear"></div>
                <button id="nextBtn">
                    <i class="fa-solid fa-chevron-right">></i>
                </button>
            </div>
            <div class="days">
                <div class="day">Mon</div>
                <div class="day">Tue</div>
                <div class="day">Wed</div>
                <div class="day">Thu</div>
                <div class="day">Fri</div>
                <div class="day">Sat</div>
                <div class="day">Sun</div>
            </div>
            <div class="dates" id="dates"></div>
        </div>
    </div>

    <script src="script3.js"></script>
</body>
</html>
